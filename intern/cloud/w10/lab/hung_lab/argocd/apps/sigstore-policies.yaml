apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sigstore-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/Auzema/nguyendkhanhhung-aws-accelerator-p2.git
    path: intern/cloud/w10/lab/hung_lab/sigstore
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
