apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatesttag
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowLatestTag
  targets:
  - target: admission.k8s.gatekeeper.sh
    rego: |
      package k8sdisallowlatesttag
      violation[{"msg": msg}] {
        container := input.review.object.spec.template.spec.containers[_]
        endswith(container.image, ":latest")
        msg := sprintf("Container '%v' dùng image tag :latest — phải pin version cụ thể", [container.name])
      }
      violation[{"msg": msg}] {
        container := input.review.object.spec.template.spec.containers[_]
        not contains(container.image, ":")
        msg := sprintf("Container '%v' không có tag — phải pin version cụ thể", [container.name])
      }
