apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.37.7
    helm:
      values: |
        dashboard:
          enabled: true   # web UI for watching canary rollouts
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  # The API server defaults spec.conversion={strategy:None} on CRDs the chart
  # doesn't set it on -> ArgoCD reports OutOfSync forever. Ignore that field.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
