apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.1.1
    helm:
      values: |
        prometheus:
          prometheusSpec:
            # Discover ServiceMonitors / PrometheusRules from ALL namespaces,
            # not only those labelled by this Helm release. Needed so our own
            # ServiceMonitor (Phase 4) and PrometheusRule (Phase 6) are picked up.
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
        alertmanager:
          alertmanagerSpec:
            # Mount the manually-created Secret holding the Gmail app password
            # at /etc/alertmanager/secrets/alertmanager-smtp/password
            secrets:
              - alertmanager-smtp
          config:
            global:
              smtp_smarthost: 'smtp.gmail.com:587'
              smtp_from: 'lemans19008@gmail.com'
              smtp_auth_username: 'lemans19008@gmail.com'
              # Password read from the mounted Secret file -> never in Git.
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
              smtp_require_tls: true
            route:
              group_by: ['alertname']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 1h
              receiver: 'null'        # default: drop
              routes:
                - matchers: ['alertname = "Watchdog"']
                  receiver: 'null'
                - matchers: ['severity = "critical"']
                  receiver: 'email'
            receivers:
              - name: 'null'
              - name: 'email'
                email_configs:
                  - to: 'lemans19008@gmail.com'
                    send_resolved: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # CRDs are large (>256KB)
